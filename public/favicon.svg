<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f16"/>
      <stop offset="100%" stop-color="#04070a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2be6a4"/>
      <stop offset="100%" stop-color="#2bb4ff"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ffbc0"/>
      <stop offset="100%" stop-color="#2be6a4"/>
    </linearGradient>
  </defs>

  <!-- Escudo hexagonal -->
  <path d="M32 2 L58 14 V34 C58 48 47 58 32 62 C17 58 6 48 6 34 V14 Z"
        fill="url(#bg)" stroke="url(#edge)" stroke-width="2.2"/>

  <!-- Circuito decorativo -->
  <g stroke="#2be6a4" stroke-width="1" opacity="0.35" fill="none">
    <path d="M12 20 H20 M44 20 H52 M12 44 H18 M46 44 H52"/>
    <circle cx="12" cy="20" r="1.4" fill="#2be6a4" stroke="none"/>
    <circle cx="52" cy="20" r="1.4" fill="#5fd0ff" stroke="none"/>
    <circle cx="12" cy="44" r="1.4" fill="#5fd0ff" stroke="none"/>
    <circle cx="52" cy="44" r="1.4" fill="#2be6a4" stroke="none"/>
  </g>

  <!-- Prompt de terminal: ">" + cursor -->
  <path d="M22 24 L32 32 L22 40" fill="none" stroke="url(#glyph)"
        stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="36" y="36" width="10" height="4.4" rx="1" fill="url(#glyph)"/>
</svg>
